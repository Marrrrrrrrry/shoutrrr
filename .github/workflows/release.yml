name: Release Workflow

on:
  push:
    tags:
      - v*

permissions:
  contents: write

# Queue runs instead of cancelling in-progress ones: pushing several tags in a
# row must not discard the earlier release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build Shoutrrr
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: arnested/go-version-action@697236828ba755d1949ca46316abf0b4d9f6a205 # v2.1.6
        id: go-version

      - name: Set up Go ${{ steps.go-version.outputs.latest }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: ${{ steps.go-version.outputs.latest }}
          check-latest: true

      - name: Build
        run: CGO_ENABLED=0 go build -v .

      - name: Test
        run: CGO_ENABLED=0 go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true

      - name: Show GoReleaser version
        run: goreleaser -v

      - name: Login to docker hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: Execute goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: CGO_ENABLED=0 goreleaser release --clean
  # Snap publishing is suspended: the "shoutrrr" name is registered under the
  # upstream organization and cannot be transferred with the fork.
