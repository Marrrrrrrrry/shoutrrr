name: Security Scan

# Weekly vulnerability scan. govulncheck reports only vulnerable functions that
# are actually reachable from this codebase, which is more precise than
# dependency-list matching.
# Note: repository-level Dependabot alerts scan continuously and are
# complementary to this workflow. Enable them under Settings > Code security.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 03:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Always scan with the latest stable toolchain: go.mod only declares
          # the minimum supported Go version, while release artifacts are built
          # with the latest Go (see release.yml), so scanning must match that.
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
