name: shoutrrr 
base: core22 
version: '0.7.1' 
summary: Sending notifications made easy. 
description: |
  Shoutrrr is a way of making the sending of notifications easy by standardizing it.
grade: stable 
confinement: strict 
contact: https://github.com/marrrrrrrrry/shoutrrr/discussions
issues: https://github.com/marrrrrrrrry/shoutrrr/issues
icon: docs/shoutrrr-logotype.png
license: MIT
source-code: https://github.com/marrrrrrrrry/shoutrrr
type: app
compression: lzo

apps:
  shoutrrr:
    command: bin/shoutrrr
    plugs:
      - network
      - network-observe

parts:
  shoutrrr:
    plugin: go
    source: . 
    source-type: git
    build-packages:
      - golang
    build-environment:
      - CGO_ENABLED: 0

